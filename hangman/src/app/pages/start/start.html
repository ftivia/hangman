<div class="page">
  <h1 class="title">The Hangman</h1>

  <h2 class="subtitle">Let's play Hangman!</h2>

  <p class="text">
    How many letters do you want in your word?
  </p>

  <div class="numbers">
    @for (len of availableLengths(); track len) {
    <button class="num pointer" [class.active]="isActive(len)" (click)="select(len)">
      {{ len }}
    </button>
    }
  </div>

  <button class="random pointer" (click)="random()">Random</button>

  <button class="play pointer" (click)="goToGame()">Lets Play!</button>
</div>
