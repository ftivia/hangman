<div class="game">
    <div class="header pointer" (click)="goToInstructions()">
        Instructions
    </div>

    <div class="content">
        <div class="svg">
            <app-svg [next]="nextStep()" [reset]="resetStep()" />
        </div>

        <div class="words">
            <div class="title">The Hangman</div>
            <div class="response"></div>
            <app-word></app-word>    
            <div class="text">Play with a word</div>
            <app-letters></app-letters>    
            <div class="footer">
                <button (click)="endGame()">End game</button>
                <button (click)="startGame()">Start new game</button>
            </div>
        </div>

    </div>
</div>
