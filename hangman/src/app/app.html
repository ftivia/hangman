<div class="page">
  <div class="box">

    @switch (page()) {
      @case ('game') {
        <app-game (navigate)="goTo('instructions')" />
      }

      @case ('instructions') {
        <app-instructions (navigate)="goTo('start')" />
      }

      @case ('start') {
        <app-start (navigate)="goTo('game')" />
      }
    }

  </div>
</div>
